# Mini Mammoth - T3 endgame super-heavy breacher
# Armored twin-cannon platform with AA-capable machinegun pods.
# Per-turret attack permissions: the MGs can hit air even though the main
# guns can not - the mammoth defends itself, but is not an AA unit.

[core]
name: miniMammoth
class: CustomUnitMetadata
price: 3800
maxHp: 1400
mass: 12000
techLevel: 3
buildSpeed: 40s
radius: 16
displayRadius: 17
isBio: false
availableInDemo: true

displayText: Mini Mammoth
displayDescription: -Twin heavy cannons\n-MGs can shoot air\n-Heavy armor, very slow

armour: 8
armourMinDamageToKeep: 5

builtFrom_1_name: landFactory
builtFrom_1_pos: 15.7

[graphics]
total_frames: 2
image: miniMammoth.png
image_wreak: miniMammoth_dead.png
image_turret: miniMammoth_turret.png
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 1
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 3
dustEffect: true
teamColoringMode: pureGreen

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turretSize: 14
turretTurnSpeed: 3
maxAttackRange: 190
shootDelay: 2.5s
aimOffsetSpread: 0.2

# --- main twin cannons ---
[turret_1]
x: 0
y: -1
projectile: 1
turnSpeed: 3
turnSpeedAcceleration: 0.8
shoot_sound: large_gun_fire1
shoot_sound_vol: 0.35
shoot_flame: large, CUSTOM:lightSlowFade
shoot_light: #FFEEDDCC
canShoot: true
recoilOffset: -4
recoilOutTime: 6
recoilReturnTime: 14

[projectile_1]
directDamage: 110
life: 70
speed: 8
frame: 6
drawSize: 1.2

# --- left MG pod: fires on its own cycle, CAN hit air ---
[turret_2]
x: -8
y: 4
attachedTo: 1
slave: true
invisible: true
projectile: 2
turnSpeed: 8
delay: 0.2s
maxAttackRange: 140
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
shoot_sound: gun_fire
shoot_sound_vol: 0.1

[projectile_2]
directDamage: 8
life: 40
speed: 9
frame: 0
drawSize: 0.8

# --- right MG pod: mirror of the left (explicit - copyFrom is file-level!) ---
[turret_3]
x: 8
y: 4
attachedTo: 1
slave: true
invisible: true
projectile: 2
turnSpeed: 8
delay: 0.2s
maxAttackRange: 140
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
shoot_sound: gun_fire
shoot_sound_vol: 0.1

[movement]
movementType: LAND
moveSpeed: 0.55
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.1
maxTurnSpeed: 2
turnAcceleration: 0.15
moveSlidingMode: false
moveIgnoringBody: false

[ai]
useAsBuilder: false

# --- custom effect (per-mod namespace: must be defined in THIS mod to use CUSTOM:) ---
[effect_lightSlowFade]
image: light_50.png
life: 40
fadeOut: true
attachedToUnit: true
color: #ffddaa
scaleFrom: 0.7
scaleTo: 0.7
alpha: 0.5
drawUnderUnits: true
