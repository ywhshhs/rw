# Mini Mortar - T2 mid-game siege platform
# Lobs ballistic AoE shells from long range. Classic artillery balance:
# deadly from afar, dies to anything that reaches it.

[core]
name: miniMortar
class: CustomUnitMetadata
price: 900
maxHp: 160
mass: 2600
techLevel: 2
buildSpeed: 14s
radius: 10
displayRadius: 11
isBio: false
availableInDemo: true

displayText: Mini Mortar
displayDescription: -Long range lobbed shells\n-Splash damage\n-Slow and fragile, keep it guarded

builtFrom_1_name: landFactory
builtFrom_1_pos: 15.5

[graphics]
total_frames: 2
image: miniMortar.png
image_wreak: miniMortar_dead.png
image_turret: miniMortar_turret.png
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 1
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 3
movementEffect: CUSTOM:trackDust
movementEffectRate: 6
teamColoringMode: pureGreen

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turretSize: 12
turretTurnSpeed: 2.5
maxAttackRange: 280
shootDelay: 2s
aimOffsetSpread: 0.5

[turret_1]
x: 0
y: 0
projectile: 1
turnSpeed: 2.5
turnSpeedAcceleration: 0.6
shoot_sound: cannon_firing
shoot_sound_vol: 0.3
shoot_flame: medium, CUSTOM:lightSlowFade
shoot_light: #FFEEDDAA
canShoot: true
recoilOffset: -3
recoilOutTime: 4
recoilReturnTime: 10

# ballistic lobbed shell with splash
[projectile_1]
directDamage: 15
areaDamage: 30
areaRadius: 30
life: 90
speed: 4
ballistic: true
ballistic_delaymove_height: 0
ballistic_height: 30
frame: 3
drawSize: 1
trailEffect: true

[movement]
movementType: LAND
moveSpeed: 0.7
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.15
maxTurnSpeed: 3
turnAcceleration: 0.2
moveSlidingMode: false
moveIgnoringBody: false

[ai]
useAsBuilder: false

[effect_lightSlowFade]
image: light_50.png
life: 40
fadeOut: true
attachedToUnit: true
color: #ffddaa
scaleFrom: 0.8
scaleTo: 0.8
alpha: 0.5
drawUnderUnits: true

[effect_trackDust]
image: light_50.png
life: 25
fadeOut: true
color: #99998888
scaleFrom: 0.4
scaleTo: 1.1
alpha: 0.35
yOffsetRelative: 6
drawUnderUnits: true
