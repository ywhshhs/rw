# Mini AA - T2 anti-air tank
# Fires 3 rockets at once every 0.75s, but can ONLY hit flying units.
# Balance pillar: AA units are balanced by restriction, not cost.
# Slow chassis (0.9) so it can't chase-kite early air or be rushed out cheaply.

[core]
name: miniAA
class: CustomUnitMetadata
price: 750
maxHp: 125
mass: 2200
techLevel: 2
buildSpeed: 9s
radius: 10
displayRadius: 11
isBio: false
availableInDemo: true

displayText: Mini AA
displayDescription: -Anti-air only: 3 rockets every 0.75s\n-Can not attack ground targets\n-Keep it behind the mini tanks

maxShield: 50
shieldRegen: 0.15

# --- T1 army factory only (same gate as the rest of the pack) ---
builtFrom_1_name: landFactory
builtFrom_1_pos: 15.3

[graphics]
total_frames: 2
image: miniAA.png
image_wreak: miniAA_dead.png
image_turret: miniAA_turret.png
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 2
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 3
dustEffect: true
teamColoringMode: pureGreen

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: false
canAttackUnderwaterUnits: false
turretSize: 9
turretTurnSpeed: 6
maxAttackRange: 170
shootDelay: 0.75s
aimOffsetSpread: 0.25

# --- master turret: aims only, never fires (vanilla missile-tank pattern) ---
[turret_1]
x: 0
y: -1
canShoot: false
shouldResetTurret: false
recoilOffset: -2
recoilOutTime: 5
recoilReturnTime: 8

# --- the 3 firing pods: slaved to the master aim, fire together each volley ---
[turret_2]
x: -5
y: 2
attachedTo: 1
slave: true
invisible: true
warmup: 2
projectile: 1
shoot_sound: missile_fire
shoot_sound_vol: 0.2
shoot_flame: small, CUSTOM:lightSlowFade
shoot_light: #FFCCCCDD

[turret_3]
x: 5
y: 2
copyFrom: 2
warmup: 2

# --- the rocket itself: custom sprite + smoke trail + launch ramp ---
[projectile_1]
directDamage: 25
life: 70
speed: 1.5
targetSpeed: 7
image: rocket.png
trailEffect: true

[movement]
movementType: LAND
moveSpeed: 0.9
moveAccelerationSpeed: 0.07
moveDecelerationSpeed: 0.15
maxTurnSpeed: 4
turnAcceleration: 0.3
moveSlidingMode: false
moveIgnoringBody: false

[ai]
useAsBuilder: false

# --- spinning radar dish (AEA-style: separate turret sprite with idleSpin) ---
[turret_4]
x: 0
y: 8
image: radarDish.png
canShoot: false
idleSpin: 2
size: 5

[effect_lightSlowFade]
image: light_50.png
life: 40
fadeOut: true
attachedToUnit: true
color: #ccddff
scaleFrom: 0.7
scaleTo: 0.7
alpha: 0.5
drawUnderUnits: true
