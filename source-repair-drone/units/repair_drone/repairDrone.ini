# Repair Drone - tiny hover drone that heals nearby friendly units
# Buildable ONLY from the T1 army factory (landFactory) - NOT from the starter base.
# Unarmed by design (no [attack] section at all = no weapon, no attack menu).

[core]
name: repairDrone
class: CustomUnitMetadata
price: 300
maxHp: 120
mass: 400
techLevel: 1
buildSpeed: 4s
radius: 7
displayRadius: 9
isBio: false
availableInDemo: true

displayText: Repair Drone
displayDescription: -Repairs nearby friendly units\n-Hovers over land and water\n-Defenseless, keep it safe

# --- small personal shield ---
maxShield: 50
shieldRegen: 0.15

# --- ONLY from the T1 army factory ---
builtFrom_1_name: landFactory
builtFrom_1_pos: 15.1

# --- repair capability ---
canRepairUnits: true
nanoRepairSpeed: 0.25
nanoRange: 70

[graphics]
total_frames: 2
image: repairDrone.png
image_wreak: repairDrone_dead.png
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 2
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2
teamColoringMode: pureGreen

[movement]
movementType: HOVER
moveSpeed: 1.4
moveAccelerationSpeed: 0.08
moveDecelerationSpeed: 0.2
maxTurnSpeed: 5
turnAcceleration: 0.3
moveSlidingMode: true
moveIgnoringBody: true
targetHeight: 1.5
targetHeightDrift: 0.8

[ai]
useAsBuilder: false
