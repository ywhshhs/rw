# AE Vulture - starter-base salvage vehicle. Eats wrecks for credits.
# Income is 100% wreck-limited: no wrecks = no money = impossible to snowball.
[core]
name: aeVulture
class: CustomUnitMetadata
price: 500
maxHp: 170
mass: 1600
techLevel: 1
buildSpeed: 6s
radius: 9
displayRadius: 10
isBuilder: true
availableInDemo: true

displayText: Vulture
displayDescription: -Salvages wrecks for credits\n-Fights nothing, fears everything\n-Wait for the battle to pass

nanoUnbuildSpeed: 1.5
nanoRange: 75

canBuild_1_name: reclaim
canBuild_1_pos: -1

builtFrom_1_name: commandCenter
builtFrom_1_pos: 3

[graphics]
total_frames: 1
image: aeVulture.png
image_wreak: aeVulture_dead.png
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1
teamColoringMode: pureGreen

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false

[movement]
movementType: LAND
moveSpeed: 0.75
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.12
maxTurnSpeed: 3.5
turnAcceleration: 0.25
softCollisionOnAll: 4

[ai]
useAsBuilder: false
