# Mini Tank - a tiny test tank (v1.2 pathing patch)
# Buildable ONLY from the T1 army factory (landFactory).
# v1.1 nerf: was buildable from starter base + all builders with 20 dmg /
# 150 hp - a swarm of them overwhelmed 3 artillery + 4 scouts. Availability
# from the command center was the real problem (early rush machine).
# v1.2 fix: trees and resource crystals are NEUTRAL UNITS in RW - with
# softCollisionOnAll: 0 the tank hard-stopped on them. Soft collision makes
# it slide around obstacles, sharper turning escapes corners faster.

[core]
name: miniTank
class: CustomUnitMetadata
price: 250
maxHp: 130
mass: 1500
techLevel: 1
buildSpeed: 5s
radius: 9
displayRadius: 10
softCollisionOnAll: 5
isBio: false
availableInDemo: true

displayText: Mini Tank
displayDescription: -A tiny test tank\n-Built from the starter base and any builder

# --- T1 army factory only (nerf: no more starter-base / builder spam) ---
builtFrom_1_name: landFactory
builtFrom_1_pos: 15.1

[graphics]
total_frames: 2
image: miniTank.png
image_wreak: miniTank_dead.png
image_turret: miniTank_turret.png
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 1
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 3
dustEffect: true
teamColoringMode: pureGreen

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turretSize: 7
turretTurnSpeed: 5
maxAttackRange: 120
shootDelay: 60

[turret_1]
x: 0
y: 0
projectile: 1
turnSpeed: 5
turnSpeedAcceleration: 1.0
shoot_sound: tank_firing
shoot_sound_vol: 0.25
shoot_flame: small
shoot_light: #FFEECCCC
canShoot: true
recoilOffset: -2

[projectile_1]
directDamage: 15
life: 60
speed: 5
frame: 1
drawSize: 1

[movement]
movementType: LAND
moveSpeed: 1.2
moveAccelerationSpeed: 0.1
moveDecelerationSpeed: 0.2
maxTurnSpeed: 6
turnAcceleration: 0.4
moveSlidingMode: false
moveIgnoringBody: false

[ai]
useAsBuilder: false
