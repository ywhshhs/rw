# Mini Tank - a tiny test tank
# Buildable from the starter base (commandCenter) and every vanilla builder.
# builtFrom_* on the unit side = "canBuild but in opposite direction":
# it adds this unit to those builders' menus without touching vanilla files.

[core]
name: miniTank
class: CustomUnitMetadata
price: 250
maxHp: 150
mass: 1500
techLevel: 1
buildSpeed: 5s
radius: 9
displayRadius: 10
isBio: false
availableInDemo: true

displayText: Mini Tank
displayDescription: -A tiny test tank\n-Built from the starter base and any builder

# --- starter base: produced like builders are ---
builtFrom_1_name: commandCenter
builtFrom_1_pos: 2

# --- every vanilla builder nano-constructs it on the ground ---
builtFrom_2_name: builder
builtFrom_2_pos: 15.1
builtFrom_2_forceNano: true

builtFrom_3_name: builderShip
builtFrom_3_pos: 15.1
builtFrom_3_forceNano: true

builtFrom_4_name: combatEngineer
builtFrom_4_pos: 15.1
builtFrom_4_forceNano: true

builtFrom_5_name: mechEngineer
builtFrom_5_pos: 15.1
builtFrom_5_forceNano: true

# --- fabricator buildings (nano-builder buildings) too ---
builtFrom_6_name: fabricatorT1
builtFrom_6_pos: 15.1
builtFrom_6_forceNano: true

builtFrom_7_name: fabricatorT2
builtFrom_7_pos: 15.1
builtFrom_7_forceNano: true

builtFrom_8_name: fabricatorT3
builtFrom_8_pos: 15.1
builtFrom_8_forceNano: true

[graphics]
total_frames: 2
image: miniTank.png
image_wreak: miniTank_dead.png
image_turret: miniTank_turret.png
image_shadow: AUTO
shadowOffsetX: 1
shadowOffsetY: 1
animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 1
animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 3
dustEffect: true
teamColoringMode: pureGreen

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
turretSize: 7
turretTurnSpeed: 5
maxAttackRange: 120
shootDelay: 60

[turret_1]
x: 0
y: 0
projectile: 1
turnSpeed: 5
turnSpeedAcceleration: 1.0
shoot_sound: tank_firing
shoot_sound_vol: 0.25
shoot_flame: small
shoot_light: #FFEECCCC
canShoot: true
recoilOffset: -2

[projectile_1]
directDamage: 20
life: 60
speed: 5
frame: 1
drawSize: 1

[movement]
movementType: LAND
moveSpeed: 1.2
moveAccelerationSpeed: 0.08
moveDecelerationSpeed: 0.2
maxTurnSpeed: 4.5
turnAcceleration: 0.25
moveSlidingMode: false
moveIgnoringBody: false

[ai]
useAsBuilder: false
